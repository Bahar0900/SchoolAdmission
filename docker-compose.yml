services:
  db:
    image: postgres:16-alpine
    container_name: school_admission_db
    restart: always
    command: postgres -c max_connections=300 -c shared_buffers=128MB
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_admission_backend
    restart: on-failure
    environment:
      - PORT=8080
      - ASPNETCORE_ENVIRONMENT=Production
      - DATABASE_URL=Host=db;Port=5432;Database=school_admission;Username=postgres;Password=postgres
      - HOLD_DURATION_SECONDS=120
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080
    container_name: school_admission_frontend
    restart: on-failure
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
